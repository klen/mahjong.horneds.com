<modal>
    <div class="c-overlay c-overlay--visible" onclick={ onClose }></div>
    <div id={ name } ref="modal" class="c-modal { 'c-modal--out': closing }" tabindex="1" role="dialog">
        <form class="c-modal__content" role="document" onsubmit={ onSubmit }>
            <div class="c-modal__body">
                <yield from="body" />
            </div>
        </form>
    </div>
    <script type="text/ts">
        require('./styles.sass')

        this.closing = false
        this.name = opts.name || `modal-${Math.ceil(Math.random() * 1e6)}`

        const open = () => {
            if (opts.show != null && !opts.show) return
            this.refs.modal.focus()
            document.body.classList.toggle('u-modal-open', true)
        }

        const close = () => {
            if (opts.close) opts.close()
            document.body.classList.toggle('u-modal-open', false)
        }

        this.on('mount', () => {
            this.refs.modal.addEventListener('keydown', this.onKeyPress)
        })

        this.on('update', open)
        this.on('unmount', close)

        this.onKeyPress = (e) => {
            const keyCode = e.which || e.keyCode || 0
            if (keyCode !== 27) return e
            if (opts.show != null && !opts.show) return e
            this.onClose(e)
        }

        this.onSubmit = (e) => {
            e.preventDefault()
            if (opts.submit && opts.submit(this.refs)) this.onClose(e)
        }

        this.onClose = (e) => {
            e.preventDefault()
            e.stopPropagation()
            this.update({ closing: true })
            setTimeout(() => {
                close()
                this.update({ closing: false })
            }, 280)
        }

    </script>
</modal>
