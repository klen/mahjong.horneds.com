<wall>
    <div class="c-wall">
        <span if={ !opts.noTitle } class="u-mb3">Dora Indicators</span>
        <div class="c-wall__tiles">
            <tile each={ tile in opts.tiles } tile={ tile } label="{ opts.noTitle && 'Ura-dora' || 'Dora' } is { descTiles[tile.next()] }" />
        </div>
    </div>
    <script type="text/ts">
        require('tags/tile')
        require('./styles.sass')

        this.descTiles = require('utils/tiles').desc
    </script>
</wall>
