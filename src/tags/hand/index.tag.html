<hand>
    <div class="u-flex mj-hand">
        <div>
            <div class="u-flex u-mb1">
                <span class="u-bold"> HAND #{ opts.number } </span>
            </div>
            <div class="u-gray-l u-mb1 u-size-s">1. Review the winning hand</div>
            <div class="u-flex u-flex--wrap">
                <tile each={ tile in concealed() } if={ tile.id != opts.hand.wait.id } tile={ tile } label={ descTiles[tile.tile] } />
                <div each={ set in called() } class="u-flex mj-hand__called">
                    <tile each={ tile in set.tiles } open={ tile.id === set.tiles[0].id } tile={ tile } label={ descTiles[tile.tile] } />
                </div>
            </div>
        </div>
        <div>
            <span class="u-mla u-center" style="width: 70px">
                { opts.hand.tsumo && 'TSUMO' || 'RON' }
            </span>
            <tile tile={ opts.hand.wait } open={ !opts.hand.tsumo } label={ descTiles[opts.hand.wait.tile] }/>
        </div>
    </div>
    <script type="text/ts">
        require('tags/tile')

        require('./styles.sass')

        this.descTiles = require('utils/tiles').desc

        // called sets are shown apart, the winning tile is drawn separately
        this.concealed = () => opts.hand.tiles().filter((tile) => !tile.set.isOpened)
        this.called = () => opts.hand.sets.filter((set) => set.isOpened)
    </script>
</hand>
