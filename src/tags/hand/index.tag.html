<hand>
    <div class="u-flex mj-hand">
        <div>
            <div class="u-flex u-mb1">
                <span class="u-bold"> HAND #{ opts.number } </span>
            </div>
            <div class="u-gray-l u-mb1 u-size-s">1. Review the winning hand</div>
            <div class="u-flex u-flex--wrap">
                <tile each={ tile in opts.hand.tiles() } if={ tile.id != opts.hand.wait.id } tile={ tile } label={ descTiles[tile.tile] } />
            </div>
        </div>
        <div>
            <span class="u-mla u-center" style="width: 70px">
                { opts.hand.tsumo && 'TSUMO' || 'RON' }
            </span>
            <tile tile={ opts.hand.wait } open={ !opts.hand.tsumo } label={ descTiles[opts.hand.wait.tile] }/>
        </div>
    </div>
    <script type="text/ts">
        require('tags/tile')

        this.descTiles = require('utils/tiles').desc
    </script>
</hand>
