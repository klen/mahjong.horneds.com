<game>
    <div if={ state.inited }>
        <div class="u-flex u-flex--wrap u-mt4 mj-header">
            <wind wind={ state.seatWind } seat={ true } title="seat"/>
            <wind wind={ state.prevalentWind } title="round"/>
            <div class="mj-dora-list">
                <wall tiles={ wall1 } />
            </div>
            <div if={ state.hand.options.riichi } class="mj-riichi-row">
                <div class="c-riichi" aria-label="The Player has declared Riichi" role="tooltip" data-microtip-position="top" tabindex="0">•</div>
                <wall tiles={ wall2 } no-title={ true }/>
            </div>
        </div>

        <div class="u-mt4">
            <hand hand={ state.hand } number={ state.number }/>
        </div>

        <scores />

    </div>
    <script type="text/ts">
        require('tags/hand')
        require('tags/wind')
        require('tags/wall')
        require('tags/scores')

        require('./styles.sass')

        this.mixin('redux')
        this.actions(require('./actions').default)
        this.subscribe(require('./selector').default)

        this.on('mount', () => {
            this.actions.init()
        })

        this.on('update', () => {
            this.wall1 = this.state.wall.slice(0, 7)
            this.wall2 = this.state.wall.slice(7, 14)
        })

    </script>
</game>
