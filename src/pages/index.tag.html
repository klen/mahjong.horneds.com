<app>
    <div class="u-flex u-flex--column u-w100" style="min-height: 100vh">
        <h1 class="c-header u-size-xxl u-m3">RIICHI SCORES TRAINER</h1>
        <div class="u-p3">
            <game class="u-w100"/>

            <div class="u-gray-l u-mb1 u-mt3 u-size-s">4. Continue to the next hand</div>

            <button class="c-button c-button--white u-upper" onclick={ onNext }> Next hand </button>

            <history />
        </div>
        <div class="u-mta u-mb3 u-center u-gray u-size-s">
            <span>© 2019</span>
            <a href="mailto:horneds@gmail.com" class="u-gray">horneds@gmail.com</a>
            <span class="u-center u-mh3"> / </span>
            <span> version { VERSION }</span>
            <span class="u-center u-mh3"> / </span>
            <a href="https://github.com/klen/mahjong.horneds.com" class="u-gray">Github</a>
            <div class="u-red-l u-mt2" style="opacity: .6">Disclaimer: This is a beta version. Bugs could be possible. Please report issues.</div>
        </div>
    </div>
    <script type="text/ts">
        require('tags/game')
        require('tags/history')

        this.VERSION = VERSION

        this.onNext = (e) => {
            this.tags.game.actions.reload()
            window.scrollTo(0, 0)
        }

    </script>
</app>
